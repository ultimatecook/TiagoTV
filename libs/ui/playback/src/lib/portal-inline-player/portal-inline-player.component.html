@if (hasPlayback()) {
    <section
        class="player-shell"
        [attr.aria-label]="'PORTALS.INLINE_PLAYER' | translate"
    >
        <!-- Over the top of the picture (above it for native-view Embedded
             MPV, which no page element can cover): the title, the sources
             chip, "…" and close. -->
        <app-inline-player-header
            class="player-shell__header"
            [heading]="heading()"
            [brand]="brand()"
            [streamUrl]="streamUrl()"
            (closed)="onClose()"
            (streamUrlCopied)="onCopied()"
        >
            @if (allSources().length > 1) {
                <app-vod-sources-chip
                    class="player-shell__sources"
                    [sources]="allSources()"
                    [count]="alternativeSources().length"
                    [matchKind]="sourcesMatchKind()"
                    [resumeLabel]="sourcesResumeLabel()"
                    [autoFailoverEnabled]="sourcesAutoFailoverEnabled()"
                    [autoFailoverSupported]="sourcesAutoFailoverSupported()"
                    [playbackLive]="sourcesPlaybackLive()"
                    (playRequested)="alternativeSourceRequested.emit($event)"
                    (pinRequested)="sourcePinRequested.emit($event)"
                    (checkRequested)="sourceCheckRequested.emit($event)"
                    (autoFailoverToggled)="
                        sourcesAutoFailoverToggled.emit($event)
                    "
                />
            }
        </app-inline-player-header>

        <div
            class="player-shell__viewport"
            #stageViewport
            [class.player-shell__viewport--with-rail]="upNextRailVisible()"
        >
            @if (ambientEnabled()) {
                <div
                    class="player-shell__ambient"
                    aria-hidden="true"
                    [style.--ambient-image]="ambientImageStyle()"
                ></div>
            }
            <app-web-player-view
                [playbackSessionKey]="playbackSessionKey()"
                [streamUrl]="streamUrl()"
                [title]="title()"
                [mediaTitle]="playerMediaTitle()"
                [upNext]="playerUpNext()"
                [playback]="playback()"
                [volume]="volume()"
                [playerOverride]="playerOverride()"
                [startTime]="startTime()"
                [seriesNavigation]="seriesNavigation()"
                [alternativeSources]="alternativeSources()"
                (alternativeSourceRequested)="
                    alternativeSourceRequested.emit($event)
                "
                (sourceCheckRequested)="sourceCheckRequested.emit($event)"
                (playbackFailed)="playbackFailed.emit($event)"
                (timeUpdate)="onTimeUpdate($event)"
                (playbackEnded)="onPlaybackEnded()"
                (previousEpisodeRequested)="onPreviousEpisodeRequested()"
                (nextEpisodeRequested)="onNextEpisodeRequested()"
                (externalFallbackRequested)="
                    onExternalFallbackRequested($event)
                "
            />
            @if (upNextRailVisible()) {
                <app-up-next-rail
                    class="player-shell__rail"
                    [items]="upNextRailItems()"
                    (episodeSelected)="onUpNextEpisodeSelected($event)"
                />
            }
        </div>
    </section>
}

<!-- Stamped into the player's fullscreen side panel (FULLSCREEN_CHANNEL_PANEL):
     the series' seasons and episodes, picked through the same inline path as
     the Up Next rail so fullscreen survives the switch. -->
<ng-template #fullscreenEpisodePanel let-open="open" let-close="close">
    <app-fullscreen-episode-panel
        [seasons]="episodePanel.seasons()"
        [open]="open()"
        (seasonSelected)="episodePanelSeasonSelected.emit($event)"
        (episodeSelected)="onPanelEpisodeSelected($event, close)"
    />
</ng-template>
