<aside class="sidebar">
    <div class="sidebar__top">
        <a
            class="sidebar__brand"
            routerLink="/workspace/dashboard"
            [attr.aria-label]="'WORKSPACE.SIDEBAR.HOME' | translate"
            data-test-id="sidebar-brand"
        >
            <span class="sidebar__greeting">{{
                'WORKSPACE.SIDEBAR.GREETING' | translate
            }}</span>
            <img
                class="sidebar__monogram"
                src="./assets/brand/logo-7.png"
                alt=""
                draggable="false"
            />
        </a>
        <!-- Hides the sidebar to browse with the whole window; the shell
             shows the way back at the header's leading edge. -->
        <button
            #hideButton
            type="button"
            class="sidebar__hide"
            data-test-id="sidebar-hide"
            [matTooltip]="
                ('WORKSPACE.SIDEBAR.HIDE' | translate) +
                ' (' +
                navSidebar.shortcutLabel +
                ')'
            "
            [attr.aria-label]="'WORKSPACE.SIDEBAR.HIDE' | translate"
            [attr.aria-keyshortcuts]="navSidebar.ariaShortcut"
            (click)="navSidebar.hide()"
        >
            <mat-icon>menu_open</mat-icon>
        </button>
    </div>

    @if (!hasNoPlaylists()) {
        <label class="sidebar__search" data-test-id="sidebar-search">
            <app-workspace-shell-sidebar-icon name="search" />
            <input
                #searchInput
                type="search"
                spellcheck="false"
                [value]="searchQuery()"
                (input)="onSearchInput($event)"
                (keydown.enter)="onSearchEnter($event)"
                [disabled]="!canUseSearch()"
                [placeholder]="
                    'WORKSPACE.SIDEBAR.SEARCH_PLACEHOLDER' | translate
                "
                [attr.aria-label]="searchPlaceholder() | translate"
            />
        </label>
    }

    <nav
        class="sidebar__nav"
        [attr.aria-label]="'WORKSPACE.SIDEBAR.NAV_LABEL' | translate"
    >
        @for (group of groups(); track group.id) {
            <section class="sidebar__group" [attr.data-group]="group.id">
                <h2 class="sidebar__group-label">
                    {{ group.labelKey | translate }}
                </h2>
                <ul class="sidebar__list">
                    @for (item of group.items; track item.id) {
                        <li>
                            <a
                                #rla="routerLinkActive"
                                class="sidebar__link"
                                [routerLink]="item.link"
                                routerLinkActive
                                [routerLinkActiveOptions]="{
                                    exact: item.exact,
                                }"
                                [class.is-active]="
                                    item.highlights && rla.isActive
                                "
                                [attr.aria-current]="
                                    item.highlights && rla.isActive
                                        ? 'page'
                                        : null
                                "
                                [attr.title]="item.labelKey | translate"
                                [attr.data-test-id]="'sidebar-link-' + item.id"
                            >
                                <app-workspace-shell-sidebar-icon
                                    [name]="item.icon"
                                    [filled]="item.highlights && rla.isActive"
                                />
                                <span class="sidebar__link-label">{{
                                    item.labelKey | translate
                                }}</span>
                            </a>
                        </li>
                    }
                </ul>
            </section>
        }
    </nav>
</aside>
