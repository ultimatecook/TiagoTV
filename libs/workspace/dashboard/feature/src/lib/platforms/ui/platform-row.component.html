@let look = design().look;
<section class="row">
    <button type="button" class="row__heading" (click)="seeAll.emit()">
        <h2 class="row__title">
            {{ row().labelKey | translate: row().labelParams }}
        </h2>
        <span class="row__see-all">{{ design().seeAllKey | translate }} ›</span>
    </button>
    <div class="row__viewport">
        <button
            type="button"
            class="row__arrow row__arrow--back"
            tabindex="-1"
            aria-hidden="true"
            (click)="scroll(-1)"
        >
            ‹
        </button>
        <div class="row__track" #track>
            @for (title of titles(); track title.kind + title.id) {
                @if (row().ranked) {
                    <div class="row__item row__ranked">
                        <span
                            class="row__rank"
                            [class.row__rank--wide]="$index >= 9"
                            aria-hidden="true"
                            >{{ $index + 1 }}</span
                        >
                        <lib-platform-title-card
                            class="row__ranked-card"
                            [title]="title"
                            [look]="look"
                            tile="poster"
                            [rank]="$index + 1"
                        />
                    </div>
                } @else {
                    <lib-platform-title-card
                        class="row__item"
                        [title]="title"
                        [look]="look"
                        [tile]="design().tiles"
                    />
                }
            }
        </div>
        <button
            type="button"
            class="row__arrow row__arrow--forward"
            tabindex="-1"
            aria-hidden="true"
            (click)="scroll(1)"
        >
            ›
        </button>
    </div>
</section>
