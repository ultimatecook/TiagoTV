@if (platforms().length > 0) {
    <section
        class="platforms"
        aria-labelledby="home-platforms-title"
        data-test-id="dashboard-platforms-rail"
    >
        <lib-home-heading
            headingId="home-platforms-title"
            [title]="'WORKSPACE.PLATFORMS.TITLE' | translate"
        />
        <ul class="platforms__row">
            @for (platform of platforms(); track platform.id) {
                <li class="platforms__item">
                    <a
                        class="platform"
                        [routerLink]="['/workspace', 'platforms', platform.id]"
                        [style.background]="platform.background"
                        [attr.aria-label]="platform.name"
                        [attr.data-test-id]="'platform-card-' + platform.id"
                    >
                        <lib-platform-logo
                            class="platform__logo"
                            [platform]="platform"
                        />
                    </a>
                </li>
            }
        </ul>
    </section>
}
