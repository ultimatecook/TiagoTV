@let selection = tv.selection();
@let current = tv.playback();
<div class="rest" aria-hidden="true">
    @if (selection) {
        @if (logo(); as logo) {
            <img
                class="rest__logo"
                [src]="logo"
                alt=""
                referrerpolicy="no-referrer"
                draggable="false"
                (error)="logoFailed()"
            />
        } @else {
            <span class="rest__name">{{ selection.channel.title }}</span>
        }
    }
</div>

@if (current) {
    <app-web-player-view
        class="player"
        data-test-id="countries-player"
        [playbackSessionKey]="tv.sessionKey()"
        [streamUrl]="current.streamUrl"
        [title]="current.title"
        [playback]="current"
        [dockable]="!tv.leaving()"
        (externalFallbackRequested)="tv.openExternally($event)"
    />
}
