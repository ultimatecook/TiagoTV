@let channel = group();
<button
    type="button"
    class="channel__main"
    [title]="channel.title"
    [attr.data-test-id]="'country-channel-' + channel.copies[0].streamId"
    (click)="play(channel.copies[0])"
>
    @if (icon(); as icon) {
        <span class="channel__plate" aria-hidden="true">
            <img
                [src]="icon"
                alt=""
                loading="lazy"
                referrerpolicy="no-referrer"
                draggable="false"
                (error)="nextIcon()"
            />
            <mat-icon class="channel__play">play_arrow</mat-icon>
        </span>
    } @else {
        <span
            class="channel__plate channel__plate--wordmark"
            aria-hidden="true"
            [style.--plate-hue]="hue()"
        >
            <span class="channel__wordmark" [attr.data-size]="wordmarkSize()">{{
                channel.title
            }}</span>
            <mat-icon class="channel__play">play_arrow</mat-icon>
        </span>
    }
    <span class="channel__name">{{ channel.title }}</span>
    @if (channel.subtitle) {
        <span class="channel__subtitle">{{ channel.subtitle }}</span>
    }
</button>
@if (channel.copies.length > 1) {
    <div
        class="channel__copies"
        role="group"
        [attr.aria-label]="'WORKSPACE.COUNTRIES.COPIES' | translate"
    >
        @for (copy of channel.copies; track copy.streamId; let index = $index) {
            <button
                type="button"
                class="channel__copy"
                [attr.aria-label]="channel.title + ' ' + labels()[index]"
                (click)="play(copy)"
            >
                {{ labels()[index] }}
            </button>
        }
    </div>
}
