name: TiagoTV installer (macOS)

# Builds the Apple Silicon .dmg on demand (Actions → "TiagoTV installer
# (macOS)" → Run workflow) or for a `tiagotv-v*` tag, and publishes it as a
# GitHub release of this repository. The app is ad-hoc signed, not notarized:
# see README → "Instalar en Mac".

on:
    workflow_dispatch:
    push:
        tags:
            - 'tiagotv-v*'

permissions:
    contents: write

concurrency:
    group: tiagotv-macos-${{ github.ref }}
    cancel-in-progress: false

jobs:
    macos-arm64:
        name: macOS (Apple Silicon)
        runs-on: macos-latest
        timeout-minutes: 120
        env:
            IPTVNATOR_EMBEDDED_MPV_PLATFORM: darwin
            IPTVNATOR_EMBEDDED_MPV_ARCH: arm64
            # Embedded MPV plays what Chromium cannot, such as the AC-3,
            # E-AC-3 and DTS audio of most MKV movies (silent otherwise).
            IPTVNATOR_REQUIRE_EMBEDDED_MPV: '1'
            MACOSX_DEPLOYMENT_TARGET: '11.0'
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Install pnpm
              uses: pnpm/action-setup@v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # libmpv and its FFmpeg build from pinned sources (LGPL, see
            # tools/embedded-mpv/README.md) in about half an hour, so the
            # staged runtime is cached until those build scripts change.
            - name: Restore the embedded MPV runtime
              id: mpv-runtime
              uses: actions/cache@v6
              with:
                  path: |
                      vendor/embedded-mpv/darwin-arm64/include
                      vendor/embedded-mpv/darwin-arm64/lib
                      vendor/embedded-mpv/darwin-arm64/runtime-manifest.json
                  key: embedded-mpv-darwin-arm64-macos11-${{ hashFiles('tools/embedded-mpv/build-macos-runtime.mjs', 'tools/embedded-mpv/download-pinned-source.mjs', 'tools/embedded-mpv/stage-macos-runtime.mjs', 'tools/embedded-mpv/stage-runtime.mjs') }}

            - name: Build the embedded MPV runtime
              if: steps.mpv-runtime.outputs.cache-hit != 'true'
              shell: bash
              run: |
                  set -euo pipefail
                  brew install meson ninja pkg-config nasm autoconf automake libtool xz
                  PREFIX="${RUNNER_TEMP}/embedded-mpv-runtime/arm64/prefix"
                  pnpm embedded-mpv:build-runtime -- arm64 "${PREFIX}"
                  pnpm embedded-mpv:stage-runtime -- darwin arm64 "${PREFIX}"

            - name: Build
              run: pnpm run build:backend

            - name: Check the embedded MPV build
              shell: bash
              run: |
                  set -euo pipefail
                  find dist/apps/electron-backend/native -maxdepth 2 -type f | sort
                  test -f dist/apps/electron-backend/native/embedded_mpv.node
                  test -f dist/apps/electron-backend/native/embedded-mpv-runtime.json
                  test -f dist/apps/electron-backend/native/lib/libmpv.2.dylib || test -f dist/apps/electron-backend/native/lib/libmpv.dylib

            # The packaged interface's build number: the app takes interface
            # updates newer than it (tiagotv-ui-update.yml).
            - name: Stamp the interface build
              run: node tools/tiagotv/ui-bundle.mjs stamp dist/apps/web

            # The targets' own arch lists win over `--arch`, and with no
            # Developer ID certificate electron-builder would leave the app
            # unsigned, which Apple Silicon refuses to launch: build arm64
            # only and sign ad hoc (identity "-").
            - name: Configure an ad-hoc signed Apple Silicon build
              run: |
                  node -e "
                    const fs = require('fs');
                    const config = JSON.parse(fs.readFileSync('electron-builder.json', 'utf8'));
                    for (const target of [].concat(config.mac.target)) {
                      if (target && typeof target === 'object') {
                        target.arch = ['arm64'];
                      }
                    }
                    config.mac.identity = '-';
                    fs.writeFileSync('electron-builder.json', JSON.stringify(config, null, 4) + '\\n');
                  "

            - name: Package the .dmg
              run: pnpm run make:app -- --publishPolicy=never

            - name: Check the app bundle
              shell: bash
              run: |
                  set -euo pipefail
                  ls -la dist/executables
                  APP_PATH="dist/executables/mac-arm64/TiagoTV.app"
                  if [ ! -d "${APP_PATH}" ]; then
                      echo "::error::Expected app bundle not found at ${APP_PATH}"
                      exit 1
                  fi
                  codesign --verify --deep --strict --verbose=2 "${APP_PATH}"
                  SIGNATURE_INFO="$(codesign -dv --verbose=4 "${APP_PATH}" 2>&1)"
                  printf '%s\n' "${SIGNATURE_INFO}" | sed -n '1,16p'
                  if ! printf '%s\n' "${SIGNATURE_INFO}" | grep -q 'Signature=adhoc'; then
                      echo "::error::TiagoTV.app is not ad-hoc signed"
                      exit 1
                  fi
                  for binary in "${APP_PATH}"/Contents/MacOS/*; do lipo -archs "${binary}"; done

            - name: Upload the installer
              uses: actions/upload-artifact@v7
              with:
                  name: TiagoTV-macos-arm64
                  path: dist/executables/*-mac-arm64.dmg
                  if-no-files-found: error
                  retention-days: 30

            - name: Publish a release
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  VERSION="$(node -p "require('./package.json').version")"
                  if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
                      TAG="${GITHUB_REF_NAME}"
                  else
                      TAG="tiagotv-v${VERSION}-build.${GITHUB_RUN_NUMBER}"
                  fi
                  gh release create "${TAG}" dist/executables/*-mac-arm64.dmg \
                      --target "${GITHUB_SHA}" \
                      --title "TiagoTV ${VERSION} (build ${GITHUB_RUN_NUMBER})" \
                      --notes "Instalador para Mac con chip Apple. Abrí el .dmg, arrastrá TiagoTV a Aplicaciones y seguí README → Instalar en Mac." \
                      --prerelease
