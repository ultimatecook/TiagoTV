name: TiagoTV installer (macOS)

# Builds the Apple Silicon .dmg on demand (Actions → "TiagoTV installer
# (macOS)" → Run workflow) or for a `tiagotv-v*` tag, and publishes it as a
# GitHub release of this repository. The app is ad-hoc signed, not notarized:
# see README → "Instalar en Mac".

on:
    workflow_dispatch:
    push:
        tags:
            - 'tiagotv-v*'

permissions:
    contents: write

concurrency:
    group: tiagotv-macos-${{ github.ref }}
    cancel-in-progress: false

jobs:
    macos-arm64:
        name: macOS (Apple Silicon)
        runs-on: macos-latest
        timeout-minutes: 90
        env:
            IPTVNATOR_EMBEDDED_MPV_PLATFORM: darwin
            IPTVNATOR_EMBEDDED_MPV_ARCH: arm64
            # Embedded MPV needs a vendored libmpv build; the app falls back
            # to the built-in players and external MPV/VLC without it.
            IPTVNATOR_REQUIRE_EMBEDDED_MPV: '0'
            # No Developer ID certificate: electron-builder ad-hoc signs.
            CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Install pnpm
              uses: pnpm/action-setup@v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm run build:backend

            - name: Package the .dmg
              run: pnpm run make:app -- --publishPolicy=never --arch=arm64

            - name: Check the app bundle
              shell: bash
              run: |
                  set -euo pipefail
                  ls -la dist/executables
                  APP_PATH="$(find dist/executables -maxdepth 3 -name 'TiagoTV.app' -type d | head -n 1)"
                  if [ -z "${APP_PATH}" ]; then
                      echo "::error::TiagoTV.app not found"
                      exit 1
                  fi
                  codesign --verify --deep --strict --verbose=2 "${APP_PATH}"
                  codesign -dv "${APP_PATH}" 2>&1 | sed -n '1,12p'

            - name: Upload the installer
              uses: actions/upload-artifact@v7
              with:
                  name: TiagoTV-macos-arm64
                  path: dist/executables/*.dmg
                  if-no-files-found: error
                  retention-days: 30

            - name: Publish a release
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  VERSION="$(node -p "require('./package.json').version")"
                  if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
                      TAG="${GITHUB_REF_NAME}"
                  else
                      TAG="tiagotv-v${VERSION}-build.${GITHUB_RUN_NUMBER}"
                  fi
                  gh release create "${TAG}" dist/executables/*.dmg \
                      --target "${GITHUB_SHA}" \
                      --title "TiagoTV ${VERSION} (build ${GITHUB_RUN_NUMBER})" \
                      --notes "Instalador para Mac con chip Apple. Abrí el .dmg, arrastrá TiagoTV a Aplicaciones y seguí README → Instalar en Mac." \
                      --prerelease
